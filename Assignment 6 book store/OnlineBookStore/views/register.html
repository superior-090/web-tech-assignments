<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | BookNest</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><header class="site-header"><a class="brand" href="/">Book<span>Nest</span></a><nav class="main-nav"><a href="/">Home</a><a href="/catalogue">Catalogue</a></nav></header><main class="auth-main"><section class="auth-card"><p class="eyebrow">Your reading journey starts here</p><h1>Create your account.</h1><div class="flash-message" role="alert"></div><form action="/register" method="POST"><label>Full name<input type="text" name="name" autocomplete="name" minlength="2" maxlength="100" placeholder="Your full name" required></label><label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label><label>Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required></label><button class="button" type="submit">Create account</button></form><p class="form-switch">Already have an account? <a href="/login">Login</a></p></section></main><script src="/js/main.js"></script></body></html>
